# Official Temporal Helm chart — Postgres for default + visibility (no Elasticsearch).
# Postgres host must match Bitnami release name + "-postgresql" (see install.sh).

shims:
  dockerize: false
  elasticsearchTool: false

server:
  config:
    namespaces:
      create: true
      namespace:
        - name: default
          retention: 3d
    persistence:
      defaultStore: default
      visibilityStore: visibility
      numHistoryShards: 4
      datastores:
        default:
          sql:
            createDatabase: true
            manageSchema: true
            pluginName: postgres12
            driverName: postgres12
            databaseName: temporal
            connectAddr: "temporal-pg-postgresql.temporal.svc.cluster.local:5432"
            connectProtocol: tcp
            user: postgres
            password: temporal
            maxConns: 20
            maxIdleConns: 20
            maxConnLifetime: "1h"
        visibility:
          sql:
            createDatabase: true
            manageSchema: true
            pluginName: postgres12
            driverName: postgres12
            databaseName: temporal_visibility
            connectAddr: "temporal-pg-postgresql.temporal.svc.cluster.local:5432"
            connectProtocol: tcp
            user: postgres
            password: temporal
            maxConns: 20
            maxIdleConns: 20
            maxConnLifetime: "1h"
